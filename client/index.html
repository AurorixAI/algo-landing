    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="AI-платформа для учебных центров: диагностика, экзамены, аналитика." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <title>ALGO — Умная математика.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ALGO EdTech",
      "url": "https://algo-landing.netlify.app",
      "logo": "https://algo-landing.netlify.app/favicon.svg",
      "description": "Интеллектуальная SaaS-платформа для учебных центров с AI-ядром для математики.",
      "foundingDate": "2026",
      "sameAs": []
    }
    </script>

    <style>
      #app-loader{
        position:fixed;inset:0;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:#f8fafc;
        z-index:9999;
        transition:opacity 0.3s ease;
      }
      #app-loader.fade-out{opacity:0;pointer-events:none}
      .loader-logo{
        width:56px;height:56px;
        background:#2563eb;
        border-radius:16px;
        display:flex;align-items:center;justify-content:center;
        margin-bottom:20px;
        box-shadow:0 8px 32px rgba(37,99,235,0.3);
      }
      .loader-logo span{
        font-size:26px;color:#fff;
        font-family:Georgia,serif;font-style:italic;
      }
      .loader-brand{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        font-size:20px;font-weight:800;
        color:#1e293b;letter-spacing:-0.03em;
        margin-bottom:28px;
      }
      .loader-bar{
        width:140px;height:3px;
        background:#e2e8f0;border-radius:99px;overflow:hidden;
      }
      .loader-fill{
        height:100%;width:0%;
        background:linear-gradient(90deg,#2563eb,#6366f1);
        border-radius:99px;
        animation:lp 1.4s ease-in-out forwards;
      }
      @keyframes lp{
        0%{width:0%}
        50%{width:70%}
        100%{width:95%}
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-logo"><span>∫</span></div>
      <div class="loader-brand">ALGO</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function(){
        var loader = document.getElementById('app-loader');
        var root = document.getElementById('root');
        if(!loader || !root) return;
        var obs = new MutationObserver(function(){
          if(root.children.length > 0){
            loader.classList.add('fade-out');
            setTimeout(function(){ loader.style.display='none'; }, 350);
            obs.disconnect();
          }
        });
        obs.observe(root, {childList:true});
      })();
    </script>
  </body>
</html>
